# Weekly encrypted backup of the whole database and every stored file.
# The file is encrypted with BACKUP_PASSPHRASE (the repository is public) and
# kept as a downloadable artifact for 90 days (~13 weekly copies).
# Secrets: SUPABASE_DB_PASSWORD (or SUPABASE_DB_URL), SUPABASE_SECRET_KEY, BACKUP_PASSPHRASE.
name: Weekly backup

on:
  schedule:
    - cron: '41 22 * * 4' # Thursday night, 02:41 Friday in Oman
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until configured
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_URL$SUPABASE_DB_PASSWORD" ]; then echo "::warning::Backup secrets not set yet"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install PostgreSQL 18 client (pg_dump must be at least the server version)
        if: steps.check.outputs.skip != '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != '1'
        run: npm ci
      - name: Back up and encrypt
        if: steps.check.outputs.skip != '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != '1'
        with:
          name: zawrda-backup-${{ github.run_number }}
          path: zawrda-backup-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
