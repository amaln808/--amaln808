# Free Supabase projects pause after 7 days without use. This pings the
# database every 3 days (ping() returns 1 and reads no data), and re-enables
# itself so GitHub does not switch the schedule off after 60 quiet days.
name: Keep database awake

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(jq -r .url src/data/supabase.config.json)
          key=$(jq -r .publishableKey src/data/supabase.config.json)
          if [ -z "$url" ]; then echo "::warning::Supabase not configured yet"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 -X POST "$url/rest/v1/rpc/ping" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
