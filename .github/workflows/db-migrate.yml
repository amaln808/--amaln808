# Applies new database changes (supabase/migrations) to Supabase after each merge to main.
# Requires the repository secret SUPABASE_DB_PASSWORD (or a full SUPABASE_DB_URL); without it the job does nothing.
name: Apply database changes

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql if missing
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: scripts/db-migrate.sh
